<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · InternHub</title>
<meta name="description" content="Sign in to your InternHub account to save internships and track deadlines.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/ui.css">
<link rel="stylesheet" href="assets/css/auth.css">
</head>
<body class="auth-body">
<header class="auth-nav">
  <a class="brand" href="index.html"><span class="brand-mark" id="mark"></span>InternHub</a>
  <a class="back" href="index.html">← Back to site</a>
</header>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand-line">Welcome back</div>
    <h1>Sign in to InternHub</h1>
    <p class="lead">Pick up where you left off — your saved roles, deadlines and preferences.</p>
    <div class="form-err" id="err" role="alert"></div>
    <form id="signinForm" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input class="input" type="email" id="email" name="email" autocomplete="email" required placeholder="you@example.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <div class="pw-toggle">
          <input class="input" type="password" id="password" name="password" autocomplete="current-password" required placeholder="••••••••">
          <button type="button" data-pw="password" aria-label="Show password"></button>
        </div>
      </div>
      <div class="pw-row">
        <label class="check"><input type="checkbox" id="remember" checked> Keep me signed in</label>
        <a class="auth-alt" style="margin:0" href="reset.html">Forgot password?</a>
      </div>
      <button class="btn btn-primary btn-block btn-lg" type="submit" id="submitBtn">Sign in</button>
    </form>
    <p class="auth-alt">New to InternHub? <a href="register.html">Create a free account</a></p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="assets/js/firebase-config.js"></script>
<script src="assets/js/lib/ui.js"></script>
<script src="assets/js/services/platform.js"></script>
<script src="assets/js/services/auth.js"></script>
<script>
(function () {
  document.getElementById('mark').innerHTML = UI.icon('bookmark', 16, true);
  const err = document.getElementById('err');
  const form = document.getElementById('signinForm');
  const btn = document.getElementById('submitBtn');

  // show/hide password
  const eye = document.querySelector('[data-pw]');
  eye.innerHTML = UI.icon('eye', 17);
  eye.addEventListener('click', () => {
    const inp = document.getElementById(eye.dataset.pw);
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    eye.innerHTML = UI.icon(show ? 'eye-off' : 'eye', 17);
  });

  Auth.ready.then(() => { if (Auth.profile) location.replace(Auth.afterAuthPath()); });
  if (new URLSearchParams(location.search).get('suspended')) err.textContent = 'This account has been suspended. Contact support.', err.classList.add('show');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.classList.remove('show');
    const email = form.email.value.trim(), password = form.password.value;
    if (!email || !password) { err.textContent = 'Enter your email and password.', err.classList.add('show'); return; }
    btn.classList.add('is-loading'); btn.disabled = true;
    const res = await Auth.signIn(email, password, document.getElementById('remember').checked);
    if (res.ok) { await Auth.waitForUser(); location.replace(Auth.afterAuthPath()); }
    else { err.textContent = res.error; err.classList.add('show'); btn.classList.remove('is-loading'); btn.disabled = false; }
  });
})();
</script>
</body>
</html>
